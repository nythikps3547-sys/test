
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firebase Push Notification Test</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #101010;
      color: #fff;
    }

    .card {
      max-width: 520px;
      margin: 35px auto;
      padding: 24px;
      background: #202020;
      border: 1px solid #383838;
      border-radius: 16px;
    }

    h1 { font-size: 25px; }

    p { line-height: 1.6; }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      overflow-wrap: anywhere;
      color: #f6d365;
    }

    #token {
      padding: 12px;
      background: #151515;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 12px;
      user-select: text;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Firebase Push Test</h1>
    <p>Register this phone to receive a test notification.</p>

    <button id="enableButton">Enable Notifications</button>
    <button id="copyButton" disabled>Copy Device Token</button>

    <p id="status" role="status">Ready to connect.</p>
    <p id="token">Your device token will appear here.</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDdyukNKzRKK5ku9eg7bQu205hB83cBNNE",
      authDomain: "test-ae409.firebaseapp.com",
      projectId: "test-ae409",
      storageBucket: "test-ae409.firebasestorage.app",
      messagingSenderId: "1072582076346",
      appId: "1:1072582076346:web:b915818128de45d0fc5f83"
    };

    const vapidKey =
      "BCEnCX8Cov-ypR7PLzSbo6fZbIPLAnzavMfOW_N-kDk6NpMDrW9bx0YY5pNqcfMGvGR_arG2MkvXCefuVJtf80E";

    const statusElement = document.getElementById("status");
    const tokenElement = document.getElementById("token");
    const enableButton = document.getElementById("enableButton");
    const copyButton = document.getElementById("copyButton");

    let deviceToken = "";
    let messaging;

    try {
      firebase.initializeApp(firebaseConfig);
      messaging = firebase.messaging();
    } catch (error) {
      statusElement.textContent =
        "Firebase setup error: " + error.message;
      enableButton.disabled = true;
    }

    enableButton.addEventListener("click", async () => {
      enableButton.disabled = true;

      try {
        if (!messaging) {
          throw new Error("Firebase Messaging could not initialize.");
        }

        if (!window.isSecureContext) {
          throw new Error("Open the published HTTPS website.");
        }

        if (!("Notification" in window) ||
            !("serviceWorker" in navigator)) {
          throw new Error(
            "This browser does not support the required notification features."
          );
        }

        statusElement.textContent = "Requesting permission...";

        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          throw new Error(
            "Notification permission was not granted. Check Chrome site settings."
          );
        }

        statusElement.textContent = "Registering service worker...";

        const registration = await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js"
        );

        await navigator.serviceWorker.ready;

        statusElement.textContent = "Getting device token...";

        deviceToken = await messaging.getToken({
          vapidKey: vapidKey,
          serviceWorkerRegistration: registration
        });

        if (!deviceToken) {
          throw new Error(
            "No token returned. Check Firebase Cloud Messaging and VAPID setup."
          );
        }

        tokenElement.textContent = deviceToken;
        copyButton.disabled = false;
        statusElement.textContent =
          "Success! Copy the token and send a test message from Firebase Console.";

      } catch (error) {
        console.error("FCM error:", error);
        statusElement.textContent = "Error: " + error.message;

      } finally {
        enableButton.disabled = false;
      }
    });

    copyButton.addEventListener("click", async () => {
      if (!deviceToken) return;

      try {
        await navigator.clipboard.writeText(deviceToken);
        statusElement.textContent = "Device token copied!";
      } catch (error) {
        statusElement.textContent =
          "Copy failed. Select and copy the token text manually.";
      }
    });

    if (messaging) {
      messaging.onMessage((payload) => {
        const title = payload.notification?.title || "Firebase message";
        const body = payload.notification?.body || "Message received.";

        statusElement.textContent = title + " — " + body;
      });
    }
  </script>
</body>
</html>
